<!DOCTYPE html> <!-- 🇺🇲 If you want to leave notes for yourself or collaborators, put comments inside the HTML (after the doctype). That way you stay standards‑compliant. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>INTERNET RADIO</title>
  <!-- EFI-1 Radio (Q3&Q4) -->
  <!-- Import Google Sans Code -->
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #0a0a0a, #191919);
      color: #e1e1e1;
      font-family: 'Google Sans Code', sans-serif; /* applied globally */
      text-align: center;
      margin: 0;
      padding: 50px;
    }

    /* Solid Gold Text Effect (no gradient clipping) */
    header, h2 {
      font-weight: 800; /* ExtraBold */
      text-transform: uppercase;
      letter-spacing: 5px;
      color: #FFD200; /* solid gold */
      text-shadow:
        1px 1px 5px #000,
        0 0 10px rgba(255, 215, 0, 1),
        0 0 20px rgba(255, 215, 0, 0.5);
    }

    header {
      font-size: 2.5em;
      margin-bottom: 25px;
      border-bottom: 1px solid #FFD200;
      padding-bottom: 10px;
      box-shadow: 0 1px 10px rgba(255, 215, 0, 0.5);
      text-align: center; /* centers the header text */
    }

    .station-card {
      background: linear-gradient(145deg, #323232, #282828);
      border: 1px solid #FFD200;
      border-radius: 25px;
      padding: 25px;
      margin: 25px auto;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    iframe {
      border: none;
      width: 100%;
      max-width: 320px;
      height: 350px;
      border-radius: 10px;
    }

    .counter-container {
      margin-top: 20px;
    }
    .counter-container img {
      display: block;
      margin: 10px auto;
      background: #000;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #FFD700;
      box-shadow: inset 0 0 10px #FFD200;
    }

    footer {
      margin-top: 50px;
      font-size: 1em;
      color: #FFD200;
      border-top: 1px solid #FFD200;
      padding-top: 10px;
      box-shadow: 0 -1px 10px rgba(255, 215, 0, 0.5);
    }
    footer a {
      color: #FFD200;
      text-decoration: none;
      font-weight: 500;
    }
    footer a:hover {
      color: #FFD200;
    }

    /* Rounded button cluster for controls at top */
    .controls {
      margin-bottom: 20px;
      display: inline-block;
      background: #225;
      border-radius: 25px;
      padding: 10px 15px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      font-family: 'Google Sans Code', sans-serif;
    }
    .btn {
      display: inline-block;
      margin: 0 10px;
      font-size: 1em;
      color: #FFD200;
      background: #325;
      padding: 5px 10px;
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(255, 215, 0, 0.1);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Media Controls at top -->
  <div class="controls">
    <span class="btn">⏮|< </span>
    <span class="btn">⏯ >||</span>
    <span class="btn">⏭ >|</span>
  </div>

  <header>EFM INTERNET RADIO</header>

  <!-- Example Station Card -->
  <div class="station-card">
    <h2>Player</h2>
    <iframe src="https://www.radiojar.com/widget/radio/dz93m1q1qxcwv/player/?trackinfo&show_now&autoplay_off" scrolling="yes"></iframe>
    <div class="counter-container">
      <a href="https://hits.sh/efi-1.github.io/Radio/">
        <img alt="Daily Hits" src="https://hits.sh/efi-1.github.io/Radio.svg?view=today-total"/>
      </a>
      <a href="https://hits.sh/efi-1.github.io/Radio/">
        <img alt="Total Hits" src="https://hits.sh/efi-1.github.io/Radio.svg"/>
      </a>
    </div>
  </div>

  <footer>
    2025 Saturday AT The LIVE!Docs
    <a href="https://efi-1.github.io/WITELITE/">EFI-1 Radio "WITELITE" Theme</a>
  </footer>
</body>
</html>
