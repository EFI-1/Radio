<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Radiojar Station</title>
  <style>
    body {
      background-color: #191932;
      color: #e0e0e0;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px;
    }
    h1 {
      color: #FAC832;
      font-size: 1em;
      margin-bottom: 20px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 30px;
      margin: 20px auto;
      max-width: 400px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }
    iframe {
      border: none;
      width: 100%;
      max-width: 300px;
      height: 350px;
    }
    .counter-container {
      margin-top: 20px;
    }
    .counter-container img {
      display: block;
      margin: 5px auto;
      background: #225;
      padding: 5px;
      border-radius: 5px;
    }
    a {
      color: #FAC832;
      text-decoration: none;
      transition: color 0.25s ease;
    }
    a:hover {
      color: #fff175;
    }
    footer {
      margin-top: 50px;
      font-size: 0.75em;
      color: #1000;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Radio Station</h1>
  
  <div class="card">
    <!-- Radiojar Player Embed -->
    <iframe src="https://www.radiojar.com/widget/radio/dz93m1q1qxcwv/player/?trackinfo&show_now&autoplay_off" scrolling="no"></iframe>
    
    <!-- Hit Counters -->
    <div class="counter-container">
      <a href="https://hits.sh/efi-1.github.io/Radio/">
        <img alt="Daily Hits" src="https://hits.sh/efi-1.github.io/Radio.svg?view=today-total&style=plastic&label=VISITORS TODAY&color=555555&labelColor=e6ffff"/>
      </a>
      <a href="https://hits.sh/efi-1.github.io/Radio/">
        <img alt="Total Hits" src="https://hits.sh/efi-1.github.io/Radio.svg?style=plastic&label=VISITORS&color=555555&labelColor=e6ffff"/>
      </a>
    </div>
  </div>
  
  <footer>
    2025 <a href="tinyurl.com/satld">SATLD Radio 1</a>
  </footer>
</body>
</html>
